name: Auto Report

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run tests and capture output
        run: |
          mkdir -p reports
          {
            echo "# Test Report"
            echo ""
            echo "Generated: $(TZ=Asia/Riyadh date '+%Y-%m-%d %H:%M %Z')"
            echo ""
            echo '```'
            node --test calculator.test.js 2>&1 || true
            echo '```'
          } > reports/test-report.md
          head -20 reports/test-report.md

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update test report"
          branch: auto-report
          delete-branch: true
          title: "[Auto] Update test report"
          body: |
            Automated test report generated by workflow.
            Timezone: Asia/Riyadh
