name: Auto Report

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate report
        run: date -u > report.txt

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update report"
          branch: auto-report
          delete-branch: true
          title: "[Auto] Update report"
          body: "Automated report generated by workflow."

      - name: Show outputs
        run: echo "PR: ${{ steps.cpr.outputs.pull-request-url }}"

# trigger re-parse
